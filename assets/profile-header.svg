    <circle cx="200" cy="40" r="1.2"/><circle cx="240" cy="40" r="1.2"/><circle cx="280" cy="40" r="1.2"/>
    <circle cx="80" cy="80" r="1.2"/><circle cx="120" cy="80" r="1.2"/><circle cx="160" cy="80" r="1.2"/>
