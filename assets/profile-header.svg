  <text x="72" y="380" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,Arial" font-size="15" fill="#475569">私有化交付主线 · 开源沉淀工具与玩法</text>

  <!-- right: fake IDE / code panel -->
  <rect x="700" y="70" width="520" height="320" rx="14" fill="url(#glass)" stroke="#243044"/>
  <circle cx="728" cy="98" r="6" fill="#EF4444"/>
  <circle cx="748" cy="98" r="6" fill="#F59E0B"/>
  <circle cx="768" cy="98" r="6" fill="#22C55E"/>
  <text x="800" y="103" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#64748B">compliance.pipeline.ts</text>
  <line x1="700" y1="120" x2="1220" y2="120" stroke="#243044"/>

  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15">
    <text x="728" y="158" fill="#64748B">01</text>
    <text x="768" y="158" fill="#C084FC">type</text>
    <text x="818" y="158" fill="#E2E8F0"> Case = { merchantId: string; reason: string }</text>
    <text x="728" y="190" fill="#64748B">02</text>
    <text x="768" y="190" fill="#C084FC">async</text>
    <text x="828" y="190" fill="#38BDF8"> function</text>
    <text x="918" y="190" fill="#FDE68A"> handleAppeal</text>
    <text x="1048" y="190" fill="#E2E8F0">(case: Case) {</text>
    <text x="728" y="222" fill="#64748B">03</text>
    <text x="798" y="222" fill="#94A3B8">const ctx =</text>
    <text x="918" y="222" fill="#38BDF8"> await</text>
    <text x="978" y="222" fill="#FDE68A"> rag.retrieve</text>
    <text x="1108" y="222" fill="#E2E8F0">(case)</text>
    <text x="728" y="254" fill="#64748B">04</text>
    <text x="798" y="254" fill="#94A3B8">const draft =</text>
    <text x="928" y="254" fill="#38BDF8"> await</text>
    <text x="988" y="254" fill="#FDE68A"> llm.compose</text>
    <text x="1118" y="254" fill="#E2E8F0">(ctx)</text>
    <text x="728" y="286" fill="#64748B">05</text>
    <text x="798" y="286" fill="#94A3B8">await</text>
    <text x="858" y="286" fill="#FDE68A"> pay.verifyMerchant</text>
    <text x="1048" y="286" fill="#E2E8F0">(case.merchantId)</text>
    <text x="728" y="318" fill="#64748B">06</text>
    <text x="798" y="318" fill="#C084FC">return</text>
    <text x="868" y="318" fill="#FDE68A"> ticket.open</text>
    <text x="988" y="318" fill="#E2E8F0">({ draft, status:</text>
    <text x="1168" y="318" fill="#86EFAC">'ready'</text>
    <text x="1220" y="318" fill="#E2E8F0"> })</text>
    <text x="728" y="350" fill="#64748B">07</text>
    <text x="768" y="350" fill="#E2E8F0">}</text>
