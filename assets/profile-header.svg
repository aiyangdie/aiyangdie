<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="aiyangdie profile">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#0f1a14"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#07C160"/>
      <stop offset="100%" stop-color="#1F6FEB"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <circle cx="1080" cy="60" r="160" fill="#07C160" opacity="0.08"/>
  <circle cx="180" cy="380" r="140" fill="#1F6FEB" opacity="0.07"/>
  <rect x="48" y="48" width="1184" height="324" rx="18" fill="#111827" stroke="#1f2937" stroke-width="1"/>

  <!-- left brand -->
  <text x="88" y="118" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial" font-size="18" fill="#07C160" letter-spacing="3">AIYANGDIE · 艾阳</text>
  <text x="88" y="178" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial" font-size="44" font-weight="700" fill="#F3F4F6">支付商户合规</text>
  <text x="88" y="224" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial" font-size="22" fill="#9CA3AF">申诉治理 · 官方支付 · 微信小程序 · 互动小游戏</text>
  <rect x="88" y="248" width="220" height="4" rx="2" fill="url(#accent)"/>

  <text x="88" y="300" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#6EE7B7">aike.ink  ·  appeal.aikex.ink  ·  open.aikex.ink</text>
  <text x="88" y="330" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#6B7280">Production systems · not demo screenshots</text>

  <!-- right capability cards -->
  <g font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial">
    <rect x="760" y="92" width="420" height="72" rx="12" fill="#0B1220" stroke="#1F2937"/>
    <circle cx="792" cy="128" r="8" fill="#07C160"/>
    <text x="816" y="122" font-size="18" font-weight="600" fill="#F9FAFB">商户合规主线</text>
    <text x="816" y="146" font-size="14" fill="#9CA3AF">申诉 AI · 工单 · 支付链路 · OAuth 中控</text>

    <rect x="760" y="180" width="420" height="72" rx="12" fill="#0B1220" stroke="#1F2937"/>
    <circle cx="792" cy="216" r="8" fill="#1F6FEB"/>
    <text x="816" y="210" font-size="18" font-weight="600" fill="#F9FAFB">微信小程序</text>
    <text x="816" y="234" font-size="14" fill="#9CA3AF">知识付费 · 导航聚合 · H5 同后端</text>

    <rect x="760" y="268" width="420" height="72" rx="12" fill="#0B1220" stroke="#1F2937"/>
    <circle cx="792" cy="304" r="8" fill="#F59E0B"/>
    <text x="816" y="298" font-size="18" font-weight="600" fill="#F9FAFB">小游戏 / 互动</text>
    <text x="816" y="322" font-size="14" fill="#9CA3AF">体素联机 · 打地鼠 · Canvas 复古玩法</text>
  </g>
</svg>
