  <text x="72" y="160" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,Arial" font-size="48" font-weight="700" fill="#F8FAFC">支付商户合规工程师</text>
  <text x="72" y="206" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,Arial" font-size="22" fill="#94A3B8">申诉 AI · 官方支付 · OAuth 中控 · 微信小程序 · 小游戏</text>
  <rect x="72" y="230" width="280" height="5" rx="2.5" fill="url(#line)"/>

